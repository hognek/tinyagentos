name: Distrust Green Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  check-all-skip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run all-skip gate
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          uv run .github/scripts/check_all_skip.py
        continue-on-error: false

      - name: Comment on PR if check fails
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          inline-comment: >
            **Distrust Green Gate**: The check failed because new test file(s)
            have all tests skipping. This means the PR adds tests that are
            completely guarded (e.g. `pytest.importorskip` on a module not
            yet available), so CI reports GREEN while asserting nothing.
            Please either implement the guarded code or remove the skips.
          file-path: .github/scripts/check_all_skip.py