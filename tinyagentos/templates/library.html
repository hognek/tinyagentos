<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Library — TinyAgentOS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@2"></script>
  <style>
    :root { --library-header-height: 3.5rem; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
    .library-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.5rem 1.5rem; border-bottom: 1px solid var(--pico-muted-border-color);
      height: var(--library-header-height); box-sizing: border-box;
    }
    .library-header h1 { margin: 0; font-size: 1.3rem; }
    .library-main { flex: 1; padding: 1.5rem; max-width: 960px; margin: 0 auto; width: 100%; box-sizing: border-box; }
    .drop-zone {
      border: 2px dashed var(--pico-muted-border-color); border-radius: 8px;
      padding: 2.5rem 1rem; text-align: center; margin-bottom: 1.5rem;
      transition: border-color 0.2s, background 0.2s;
    }
    .drop-zone.dragover {
      border-color: var(--pico-primary); background: var(--pico-primary-background);
    }
    .drop-zone p { margin: 0 0 0.75rem; color: var(--pico-muted-color); }
    .ingest-form { display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap; }
    .item-card {
      border: 1px solid var(--pico-muted-border-color); border-radius: 8px;
      padding: 1rem; margin-bottom: 0.75rem; display: flex; gap: 1rem;
      align-items: flex-start;
    }
    .item-card .thumb {
      width: 80px; height: 80px; border-radius: 4px; object-fit: cover;
      background: var(--pico-muted-border-color); flex-shrink: 0;
    }
    .item-card .info { flex: 1; min-width: 0; }
    .item-card .info h3 { margin: 0 0 0.25rem; font-size: 1rem; }
    .item-card .info .meta { font-size: 0.85rem; color: var(--pico-muted-color); }
    .status-badge {
      display: inline-block; padding: 0.1rem 0.5rem; border-radius: 4px;
      font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
    }
    .status-pending { background: var(--pico-muted-border-color); color: var(--pico-muted-color); }
    .status-processing { background: var(--pico-primary-background); color: var(--pico-primary); }
    .status-ready { background: #1a3a2a; color: #4ade80; }
    .status-error { background: #3a1a1a; color: #f87171; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--pico-muted-color); }
    .empty-state p { margin: 0.5rem 0; }
    #toast { position: fixed; bottom: 1rem; right: 1rem; z-index: 100; }
  </style>
</head>
<body>
  <header class="library-header">
    <h1>📚 Library</h1>
    <nav>
      <button class="outline secondary" onclick="document.getElementById('ingest-section').scrollIntoView()">
        + Ingest
      </button>
    </nav>
  </header>

  <main class="library-main">
    <!-- Drop zone -->
    <div id="ingest-section">
      <div class="drop-zone"
           id="drop-zone"
           hx-post="/api/library/ingest"
           hx-encoding="multipart/form-data"
           hx-target="#item-list"
           hx-swap="afterbegin"
           hx-indicator="#ingest-spinner">
        <p>Drop files here or paste a URL</p>
        <form class="ingest-form"
              id="ingest-form"
              hx-post="/api/library/ingest"
              hx-encoding="multipart/form-data"
              hx-target="#item-list"
              hx-swap="afterbegin"
              hx-indicator="#ingest-spinner">
          <input type="file" name="file" id="file-input" style="display:none"
                 onchange="document.getElementById('file-name').textContent = this.files[0]?.name || ''">
          <button type="button" class="secondary outline"
                  onclick="document.getElementById('file-input').click()">
            Choose File
          </button>
          <span id="file-name" style="font-size:0.85rem; align-self:center"></span>
          <input type="text" name="url" placeholder="Or paste a URL…" style="max-width:300px">
          <button type="submit">Ingest</button>
        </form>
        <div id="ingest-spinner" class="htmx-indicator" style="margin-top:0.5rem">
          <small aria-busy="true">Processing…</small>
        </div>
      </div>
    </div>

    <!-- Item list -->
    <div id="item-list"
         hx-get="/api/library/items?limit=50"
         hx-trigger="load, every 10s"
         hx-swap="innerHTML">
      <div class="empty-state">
        <p>No items yet. Drop a file or paste a URL above.</p>
      </div>
    </div>
  </main>

  <div id="toast"></div>

  <script>
    // Drag-and-drop support
    const dz = document.getElementById('drop-zone');
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
    dz.addEventListener('drop', e => {
      e.preventDefault();
      dz.classList.remove('dragover');
      const files = e.dataTransfer.files;
      if (files.length) {
        const dt = new DataTransfer();
        dt.items.add(files[0]);
        document.getElementById('file-input').files = dt.files;
        document.getElementById('file-name').textContent = files[0].name;
        document.getElementById('ingest-form').dispatchEvent(new Event('submit', {bubbles:true}));
      }
    });
  </script>
</body>
</html>
