id: mcp-filesystem
name: Filesystem
description: >-
  Read, write and search files under an explicitly allowed root directory.
  The reference MCP filesystem server.
version: 2025.7.1
author: modelcontextprotocol
homepage: https://github.com/modelcontextprotocol/servers
license: MIT
categories:
  - files
  - dev-tools
transport: stdio
permissions:
  - filesystem:read
  - filesystem:write
verified: true

install:
  method: npm
  package: "@modelcontextprotocol/server-filesystem"

run:
  command:
    - npx
    - "-y"
    - "@modelcontextprotocol/server-filesystem"
  args:
    - /data
