category: ai-app
description: "Self-hosted ChatGPT-style interface \u2014 connects to Ollama, llama.cpp,\
  \ any OpenAI-compatible API"
hardware_tiers:
  arm-npu-16gb: full
  arm-npu-32gb: full
  cpu-only: full
  x86-cuda-12gb: full
  x86-vulkan-8gb: full
homepage: https://github.com/open-webui/open-webui
id: open-webui
install:
  env:
    OLLAMA_BASE_URL: http://host.docker.internal:11434
  image: ghcr.io/open-webui/open-webui:0.5.0
  # This app talks to the model API, so install mints it a per-app LiteLLM
  # principal (#613) and injects OPENAI_BASE_URL / OPENAI_API_KEY into the
  # compose env: a key scoped to a model allowlist instead of one shared token
  # that reaches every model. The scope defaults to the "default" chat alias
  # (add "llm_models: [...]" to name a set) and is widened per install from the
  # app's settings -- see GET/PUT /api/apps/{app_id}/llm-access.
  llm_access: true
  method: docker
  ports:
  - 3000
  volumes:
  - data:/app/backend/data
license: MIT
name: Open WebUI
requires:
  disk_mb: 2000
  ram_mb: 512
type: service
version: 0.5.0
